<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="fav-bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00473E"/>
      <stop offset="100%" stop-color="#00241F"/>
    </linearGradient>
    <linearGradient id="fav-pulse" x1="10" y1="50" x2="90" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFC470"/>
      <stop offset="40%" stop-color="#FF8E60"/>
      <stop offset="80%" stop-color="#FF5C35"/>
      <stop offset="100%" stop-color="#00C48C"/>
    </linearGradient>
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#fav-bg)" stroke="#00C48C" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="50" cy="50" r="36" stroke="#00C48C" stroke-width="1.2" stroke-opacity="0.25" stroke-dasharray="3 3"/>
  
  <!-- Shield -->
  <path d="M50 16 L76 27 C76 54 50 76 50 76 C50 76 24 54 24 27 Z" fill="#0A5C50" stroke="#00C48C" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M50 18 L74 28 C74 52 50 73 50 73 Z" fill="#ffffff" fill-opacity="0.1"/>

  <!-- Pulse Wave -->
  <path d="M18 52 L34 52 L42 36 L50 66 L58 32 L66 58 L72 52 L82 52" fill="none" stroke="url(#fav-pulse)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#fav-glow)"/>
  <path d="M18 52 L34 52 L42 36 L50 66 L58 32 L66 58 L72 52 L82 52" fill="none" stroke="#FAF6F0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Info Core Beacon -->
  <circle cx="50" cy="28" r="3.5" fill="#FF8E60" filter="url(#fav-glow)"/>
  <circle cx="50" cy="28" r="2" fill="#FAF6F0"/>
</svg>
