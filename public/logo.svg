<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="fl-bg" x1="10" y1="10" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00473E"/>
      <stop offset="100%" stop-color="#00241F"/>
    </linearGradient>

    <!-- Pulse Wave Vibrant Gradient -->
    <linearGradient id="fl-pulse" x1="20" y1="45" x2="70" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFC470"/>
      <stop offset="40%" stop-color="#FF8E60"/>
      <stop offset="80%" stop-color="#FF5C35"/>
      <stop offset="100%" stop-color="#00C48C"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="fl-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left Icon Mark (x=8, y=8, w=74, h=74) -->
  <g transform="translate(8, 8)">
    <rect width="74" height="74" rx="20" fill="url(#fl-bg)" stroke="#00C48C" stroke-width="1.6" stroke-opacity="0.6"/>
    <circle cx="37" cy="37" r="26" stroke="#00C48C" stroke-width="0.8" stroke-opacity="0.2" stroke-dasharray="2 2"/>
    
    <!-- Shield -->
    <path d="M37 12 L55 20 C55 40 37 56 37 56 C37 56 19 40 19 20 Z" 
          fill="#0A5C50" 
          stroke="#00C48C" 
          stroke-width="1.8"/>
    <path d="M37 13.5 L53.5 21 C53.5 39 37 54.5 37 54.5 Z" 
          fill="#ffffff" 
          fill-opacity="0.08"/>

    <!-- Pulse Wave -->
    <path d="M15 39 L25 39 L30 27 L35 49 L40 25 L45 43 L49 39 L59 39" 
          fill="none" 
          stroke="url(#fl-pulse)" 
          stroke-width="3.2" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#fl-glow)"/>
    <path d="M15 39 L25 39 L30 27 L35 49 L40 25 L45 43 L49 39 L59 39" 
          fill="none" 
          stroke="#FAF6F0" 
          stroke-width="1.2" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Diagnostic Core Beacon -->
    <circle cx="37" cy="22" r="2.5" fill="#FF8E60" filter="url(#fl-glow)"/>
    <circle cx="37" cy="22" r="1.4" fill="#FAF6F0"/>
  </g>

  <!-- Right Logotype -->
  <g transform="translate(98, 22)">
    <!-- Brand Name -->
    <text x="0" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" letter-spacing="-0.5" fill="#00473E">
      MySupport<tspan fill="#FF5C35" font-style="italic" font-family="serif" font-weight="900" dx="1">Info</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="49" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" letter-spacing="2" fill="#00473E" fill-opacity="0.6">
      SYSTEM &amp; BUFFERBLOAT DIAGNOSTICS
    </text>
  </g>
</svg>
