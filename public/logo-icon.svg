<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="msi-bg" x1="15" y1="10" x2="105" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00473E"/>
      <stop offset="50%" stop-color="#003830"/>
      <stop offset="100%" stop-color="#00241F"/>
    </linearGradient>

    <!-- Shield Face Gradient -->
    <linearGradient id="msi-shield" x1="60" y1="18" x2="60" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A5C50"/>
      <stop offset="100%" stop-color="#00332B"/>
    </linearGradient>

    <!-- Pulse Wave Vibrant Gradient -->
    <linearGradient id="msi-pulse" x1="22" y1="60" x2="98" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFC470"/>
      <stop offset="35%" stop-color="#FF8E60"/>
      <stop offset="70%" stop-color="#FF5C35"/>
      <stop offset="100%" stop-color="#00C48C"/>
    </linearGradient>

    <!-- Outer Glow / Rim -->
    <linearGradient id="msi-rim" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00C48C" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FF8E60" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00473E" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Shadow & Glow Filters -->
    <filter id="msi-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>

    <filter id="msi-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#msi-bg)" stroke="url(#msi-rim)" stroke-width="2" filter="url(#msi-shadow)"/>

  <!-- Subtle Tech Radar Rings -->
  <circle cx="60" cy="60" r="42" stroke="#00C48C" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="3 3"/>
  <circle cx="60" cy="60" r="26" stroke="#FAF6F0" stroke-width="1" stroke-opacity="0.1"/>

  <!-- The Diagnostic Shield -->
  <path d="M60 20 L88 32 C88 64 60 88 60 88 C60 88 32 64 32 32 Z" 
        fill="url(#msi-shield)" 
        stroke="#00C48C" 
        stroke-width="2.5" 
        stroke-linejoin="round"/>

  <!-- Shield Core Shading Arc -->
  <path d="M60 22 L86 33.5 C86 63 60 86 60 86 L60 22 Z" 
        fill="#ffffff" 
        fill-opacity="0.06"/>

  <!-- The High-Speed Latency / Bufferbloat Pulse Wave -->
  <!-- Outer Glow Layer -->
  <path d="M26 62 L42 62 L50 44 L58 78 L66 40 L74 68 L80 62 L94 62" 
        fill="none" 
        stroke="url(#msi-pulse)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#msi-glow)"/>

  <!-- Crisp Core Line -->
  <path d="M26 62 L42 62 L50 44 L58 78 L66 40 L74 68 L80 62 L94 62" 
        fill="none" 
        stroke="#FAF6F0" 
        stroke-width="1.8" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Top Info Diagnostic Beacon Spark -->
  <circle cx="60" cy="35" r="4" fill="#FF8E60" filter="url(#msi-glow)"/>
  <circle cx="60" cy="35" r="2.2" fill="#FAF6F0"/>

  <!-- Bottom Ping Pulse Anchor Points -->
  <circle cx="26" cy="62" r="2.5" fill="#FFC470"/>
  <circle cx="94" cy="62" r="2.5" fill="#00C48C"/>
</svg>
